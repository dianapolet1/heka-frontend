<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart — Heka Universe</title>
<meta name="description" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Manrope:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.10.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/layout.css">
<link rel="stylesheet" href="/assets/css/components.css">
</head>
<body>
<div id="site-header"></div>

<main>

<section class="page-hero"><div class="container"><h1>Your cart</h1></div></section>
<div class="container">
  <div class="two-col" id="cart-page"></div>
</div>

</main>

<div id="site-footer"></div>

<script src="/assets/vendor/qrcode.js"></script>
<script src="/assets/js/utils.js"></script>
<script src="/assets/js/services.js"></script>
<script src="/assets/js/layout.js"></script>
<script src="/assets/js/ui.js"></script>
<script>
function drawCart() {
  const items = Cart.items();
  const el = document.getElementById('cart-page');
  if (!items.length) {
    el.innerHTML = '<div class="empty" style="grid-column:1/-1"><i class="ti ti-shopping-bag"></i>Your cart is empty<br><br><a class="btn btn-primary" href="/collections/all">Shop the universe</a></div>';
    return;
  }
  el.innerHTML = `
    <div>${cartLinesHtml(items)}</div>
    <div class="panel" style="align-self:start">
      <div class="totals-row"><span>Subtotal</span><span>${formatMoney(Cart.subtotal())}</span></div>
      <div class="totals-row"><span>Shipping</span><span style="color:var(--text-secondary)">At checkout</span></div>
      <div class="totals-row total"><span>Total</span><span>${formatMoney(Cart.subtotal())}</span></div>
      <a href="/checkout" class="btn btn-primary btn-block" style="margin-top:16px">Checkout</a>
      <button class="btn btn-outline btn-block" style="margin-top:8px" onclick="Cart.clear()">Empty cart</button>
    </div>`;
}
document.addEventListener('heka:cart', drawCart);
drawCart();
</script>
</body>
</html>
